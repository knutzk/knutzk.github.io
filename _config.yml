include:
  - _pages

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      read_time: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
