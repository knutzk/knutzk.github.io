title: "Knut Zoch, Ph.D. – Experimental Particle Physics & Machine Learning"
masthead_title: "Knut Zoch, Ph.D."
subtitle: "Experimental Particle Physics & Machine Learning"
copyright: "Knut Zoch"
description: "Experimental particle physicist at Harvard University and CERN with the ATLAS collaboration, specializing in top-quark physics and advancing research through machine learning methods."
