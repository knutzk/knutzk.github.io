url: "https://knutzoch.org"
repository: "knutzk/knutzk.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: "contrast"

locale: "en-US"
timezone: "Europe/Zurich"

author:
  name: "Knut Zoch, Ph.D."
  avatar: "/assets/images/avatar.jpg"
  bio: "Experimental particle physicist at Harvard University, combining CERN/ATLAS research with machine learning."
  location: "Geneva, Switzerland"
  links:
    - label: "Harvard University"
      icon: "fas fa-fw fa-building"
      url: "https://harvard.edu/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=MJ0Q724AAAAJ&hl=en"
    - label: "InspireHEP"
      icon: "fas fa-fw fa-book"
      url: "https://inspirehep.net/authors/1508982"
    - label: "ORCID ID"
      icon: "fas fa-fw fa-id-card"
